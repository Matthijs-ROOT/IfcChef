[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifcchef"
dynamic = ["version"]
description = "IFC-bestanden opschonen op basis van de OTL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.gui-scripts]
ifcchef = "ifcchef.gui:main"

[tool.hatch.version]
path = "src/ifcchef/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ifcchef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not real'"
markers = ["real: test op een echt projectmodel op de Z:-schijf (traag)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
